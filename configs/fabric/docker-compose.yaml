networks: {fabric: {driver: bridge}}
services:
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5
    environment: [FABRIC_LOGGING_SPEC=INFO, ORDERER_GENERAL_LISTENADDRESS=0.0.0.0]
    ports: ["7050:7050"]
    networks: [fabric]
  peer0.le.example.com:
    image: hyperledger/fabric-peer:2.5
    environment: [CORE_PEER_ID=peer0.le, CORE_LEDGER_STATE_STATEDATABASE=CouchDB,
                  CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984]
    networks: [fabric]
  peer0.fe.example.com:
    image: hyperledger/fabric-peer:2.5
    environment: [CORE_PEER_ID=peer0.fe, CORE_LEDGER_STATE_STATEDATABASE=CouchDB,
                  CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984]
    networks: [fabric]
  peer0.ju.example.com:
    image: hyperledger/fabric-peer:2.5
    environment: [CORE_PEER_ID=peer0.ju, CORE_LEDGER_STATE_STATEDATABASE=CouchDB,
                  CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb2:5984]
    networks: [fabric]
  couchdb0: {image: couchdb:3.2.1, networks: [fabric]}
  couchdb1: {image: couchdb:3.2.1, networks: [fabric]}
  couchdb2: {image: couchdb:3.2.1, networks: [fabric]}