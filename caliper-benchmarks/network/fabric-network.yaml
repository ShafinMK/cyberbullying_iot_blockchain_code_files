# Hyperledger Fabric Network Configuration
# For the forensic evidence blockchain network

name: ForensicEvidenceNetwork

version: "2.0.0"

caliper:
  blockchain: fabric

channels:
  evidencechannel:
    config:
      # Channel configuration
    peers:
      peer0.org1.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      peer0.org2.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      peer0.org3.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true

organizations:
  org1:
    mspid: Org1MSP
    peers:
      - peer0.org1.example.com
    certificateAuthorities:
      - ca.org1.example.com
    
  org2:
    mspid: Org2MSP
    peers:
      - peer0.org2.example.com
    certificateAuthorities:
      - ca.org2.example.com
    
  org3:
    mspid: Org3MSP
    peers:
      - peer0.org3.example.com
    certificateAuthorities:
      - ca.org3.example.com

peers:
  peer0.org1.example.com:
    url: grpc://localhost:7051
    grpcOptions:
      ssl-target-name-override: peer0.org1.example.com
      request-timeout: 120001
    
  peer0.org2.example.com:
    url: grpc://localhost:9051
    grpcOptions:
      ssl-target-name-override: peer0.org2.example.com
      request-timeout: 120001
    
  peer0.org3.example.com:
    url: grpc://localhost:11051
    grpcOptions:
      ssl-target-name-override: peer0.org3.example.com
      request-timeout: 120001

certificateAuthorities:
  ca.org1.example.com:
    url: http://localhost:7054
    caName: ca-org1
    
  ca.org2.example.com:
    url: http://localhost:8054
    caName: ca-org2
    
  ca.org3.example.com:
    url: http://localhost:11054
    caName: ca-org3

orderers:
  orderer.example.com:
    url: grpc://localhost:7050

orderer:
  grpcOptions:
    ssl-target-name-override: orderer.example.com
    request-timeout: 120001